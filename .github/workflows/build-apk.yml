name: x1One Ai Web2app - Build APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "Website URL to load inside the APK"
        required: true
        default: "https://example.com"
        type: string

      app_name:
        description: "Application name"
        required: true
        default: "x1One Ai Web2app"
        type: string

      package_name:
        description: "Android package name"
        required: true
        default: "com.x1oneai.web2app"
        type: string

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check inputs
        shell: bash
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          set -e

          if [[ ! "$WEBSITE_URL" =~ ^https?:// ]]; then
            echo "ERROR: Website URL must start with http:// or https://"
            exit 1
          fi

          if [[ ! "$PACKAGE_NAME" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
            echo "ERROR: Invalid Android package name."
            echo "Example: com.x1oneai.web2app"
            exit 1
          fi

          if [ -z "$APP_NAME" ]; then
            echo "ERROR: App name cannot be empty."
            exit 1
          fi

          echo "Website URL: $WEBSITE_URL"
          echo "App Name: $APP_NAME"
          echo "Package Name: $PACKAGE_NAME"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle
        shell: bash
        run: |
          curl -L \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Create Android project
        shell: bash
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          set -e

          python3 <<'PY'
          import os
          import html
          import re
          from pathlib import Path

          url = os.environ["WEBSITE_URL"]
          app_name = os.environ["APP_NAME"]
          package_name = os.environ["PACKAGE_NAME"]

          package_path = package_name.replace(".", "/")

          root = Path("android-app")
          src = root / "app" / "src" / "main"
          java_dir = src / "java" / package_path
          res_values = src / "res" / "values"

          java_dir.mkdir(parents=True, exist_ok=True)
          res_values.mkdir(parents=True, exist_ok=True)

          (root / "settings.gradle").write_text(
              """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "x1OneAiWeb2app"
          include(":app")
          """,
              encoding="utf-8"
          )

          (root / "build.gradle").write_text(
              """plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          """,
              encoding="utf-8"
          )

          (root / "gradle.properties").write_text(
              """android.useAndroidX=true
          android.nonTransitiveRClass=true
          """,
              encoding="utf-8"
          )

          app_gradle = """plugins {
              id 'com.android.application'
          }

          android {
              namespace '%s'
              compileSdk 35

              defaultConfig {
                  applicationId '%s'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          """ % (package_name, package_name)

          (root / "app").mkdir(parents=True, exist_ok=True)
          (root / "app" / "build.gradle").write_text(
              app_gradle,
              encoding="utf-8"
          )

          safe_app_name = html.escape(app_name, quote=True)
          safe_url = html.escape(url, quote=True)

          manifest = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          """

          (src / "AndroidManifest.xml").write_text(
              manifest,
              encoding="utf-8"
          )

          strings = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">%s</string>
              <string name="website_url">%s</string>
          </resources>
          """ % (safe_app_name, safe_url)

          (res_values / "strings.xml").write_text(
              strings,
              encoding="utf-8"
          )

          styles = """<?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#000000</item>
              </style>

          </resources>
          """

          (res_values / "styles.xml").write_text(
              styles,
              encoding="utf-8"
          )

          java = """package %s;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl(getString(R.string.website_url));
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          """ % package_name

          (java_dir / "MainActivity.java").write_text(
              java,
              encoding="utf-8"
          )

          print("Android project created successfully.")
          print("Package:", package_name)
          print("URL:", url)
          print("App:", app_name)
          PY

      - name: Build Debug APK
        working-directory: android-app
        shell: bash
        run: |
          set -e
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          set -e
          mkdir -p output

          cp \
            android-app/app/build/outputs/apk/debug/app-debug.apk \
            "output/x1One-Ai-Web2app-debug.apk"

          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: x1One-Ai-Web2app-APK
          path: output/x1One-Ai-Web2app-debug.apk
          retention-days: 7
